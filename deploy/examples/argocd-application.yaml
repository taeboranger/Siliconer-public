# Configure the real repository, project and destination before installing.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: siliconer-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/REPLACE_OWNER/Siliconer-config.git
    targetRevision: main
    path: overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: siliconer-prod
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
