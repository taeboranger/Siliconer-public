apiVersion: apps/v1
kind: Deployment
metadata:
  name: siliconer-api
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels: { app: siliconer-api }
  template:
    metadata:
      labels: { app: siliconer-api }
    spec:
      serviceAccountName: siliconer-api
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: api
          image: example-owner/siliconer-api-prod:initial
          ports: [{ name: http, containerPort: 4100 }]
          securityContext: { readOnlyRootFilesystem: true, allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
          envFrom: [{ configMapRef: { name: siliconer-settings } }]
          env:
            - { name: SILICONER_CONFIG_FILE, value: /app/config/integrations.json }
            - { name: SILICONER_DATABASE_URL, valueFrom: { secretKeyRef: { name: siliconer-api-secret, key: database-url } } }
          volumeMounts: [{ name: connectors, mountPath: /app/config, readOnly: true }, { name: tmp, mountPath: /tmp }]
          readinessProbe: { httpGet: { path: /health/ready, port: http }, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /health/live, port: http }, initialDelaySeconds: 10, periodSeconds: 20 }
          resources: { requests: { cpu: 100m, memory: 128Mi }, limits: { cpu: "1", memory: 512Mi } }
      volumes:
        - { name: connectors, configMap: { name: siliconer-connectors } }
        - { name: tmp, emptyDir: { sizeLimit: 64Mi } }
---
apiVersion: v1
kind: Service
metadata:
  name: siliconer-api
spec:
  selector: { app: siliconer-api }
  ports: [{ name: http, port: 4100, targetPort: http }]
