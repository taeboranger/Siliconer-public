apiVersion: apps/v1
kind: Deployment
metadata:
  name: siliconer-web
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels: { app: siliconer-web }
  template:
    metadata:
      labels: { app: siliconer-web }
    spec:
      serviceAccountName: siliconer-web
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: web
          image: example-owner/siliconer-web-prod:initial
          ports: [{ name: http, containerPort: 3000 }]
          securityContext: { readOnlyRootFilesystem: true, allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
          readinessProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /healthz, port: http }, initialDelaySeconds: 15, periodSeconds: 20 }
          resources: { requests: { cpu: 100m, memory: 128Mi }, limits: { cpu: "1", memory: 512Mi } }
      volumes:
        - { name: tmp, emptyDir: { sizeLimit: 64Mi } }
---
apiVersion: v1
kind: Service
metadata:
  name: siliconer-web
spec:
  selector: { app: siliconer-web }
  ports: [{ name: http, port: 3000, targetPort: http }]
