apiVersion: v1
kind: ServiceAccount
metadata:
  name: siliconer-vault-auth
  annotations: { argocd.argoproj.io/sync-wave: "-4" }
automountServiceAccountToken: false
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: siliconer-vault-auth
  annotations: { argocd.argoproj.io/sync-wave: "-4" }
spec:
  method: kubernetes
  mount: kubernetes
  vaultConnectionRef: vault-secrets-operator-system/cagea1-vault
  kubernetes:
    role: siliconer-prod-vso
    serviceAccount: siliconer-vault-auth
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: siliconer-api-runtime
  annotations: { argocd.argoproj.io/sync-wave: "-2" }
spec:
  type: kv-v2
  mount: kv
  path: siliconer-prod-api
  vaultAuthRef: siliconer-vault-auth
  refreshAfter: 1h
  rolloutRestartTargets: [{ kind: Deployment, name: siliconer-api }]
  destination:
    create: true
    name: siliconer-api-secret
    transformation:
      excludeRaw: true
      excludes: [".*"]
      templates:
        database-url:
          text: '{{- $v := get .Secrets "database-url" -}}{{- if not $v -}}{{- fail "database-url missing" -}}{{- end -}}{{- $v -}}'
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: siliconer-worker-runtime
  annotations: { argocd.argoproj.io/sync-wave: "-2" }
spec:
  type: kv-v2
  mount: kv
  path: siliconer-prod-worker
  vaultAuthRef: siliconer-vault-auth
  refreshAfter: 1h
  rolloutRestartTargets: [{ kind: Deployment, name: siliconer-worker }]
  destination:
    create: true
    name: siliconer-worker-secret
    transformation:
      excludeRaw: true
      excludes: [".*"]
      templates:
        database-url:
          text: '{{- $v := get .Secrets "database-url" -}}{{- if not $v -}}{{- fail "database-url missing" -}}{{- end -}}{{- $v -}}'
        openai-api-key:
          text: '{{ get .Secrets "openai-api-key" }}'
        notification-url:
          text: '{{ get .Secrets "notification-url" }}'
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: siliconer-migrator-runtime
  annotations: { argocd.argoproj.io/sync-wave: "-2" }
spec:
  type: kv-v2
  mount: kv
  path: siliconer-prod-migrator
  vaultAuthRef: siliconer-vault-auth
  refreshAfter: 1h
  destination:
    create: true
    name: siliconer-migrator-secret
    transformation:
      excludeRaw: true
      excludes: [".*"]
      templates:
        database-url:
          text: '{{- $v := get .Secrets "database-url" -}}{{- if not $v -}}{{- fail "database-url missing" -}}{{- end -}}{{- $v -}}'
