name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: siliconer
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: siliconer
        ports: [5432:5432]
        options: --health-cmd "pg_isready -U siliconer" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      SILICONER_TEST_DATABASE_URL: postgresql://siliconer:ci-test-only@localhost:5432/siliconer
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: actions/setup-node@v7
        with: { node-version: "24", package-manager-cache: false }
      - run: npm install -g pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Validate Kubernetes manifests without deployment
        run: kubectl kustomize deploy/kustomize/overlays/prod > /tmp/siliconer-rendered.yaml
